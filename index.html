e)};b.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();openDialog(b.dataset.edit,false)}}});document.querySelectorAll('[data-complete]').forEach(b=>b.onclick=()=>{let t=tasks.find(t=>String(t.id)===b.dataset.complete);if(t){t.done=!t.done;save();render()}});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('למחוק את הפריט?')){tasks=tasks.filter(t=>String(t.id)!==b.dataset.delete);save();render()}});bindDrag()}
function openDialog(id,move){editing=id;let t=tasks.find(t=>String(t.id)===String(id));if(!t)return;$('dialog').innerHTML=`<div class="modal-bg" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="עריכת פריט"><h2>${move?'העברה בין רבעים':'עריכת פריט'}</h2><label class="sr-only" for="editText">תוכן</label><textarea id="editText">${escapeHtml(t.text)}</textarea><label class="sr-only" for="editQ">רבע</label><select id="editQ">${quadrants.map((q,i)=>`<option value="${i}" ${i===t.q?'selected':''}>${q.name}</option>`).join('')}</select><div class="schedule-fields"><span class="schedule-label">תאריך ושעה</span><div class="date-time-row"><div class="date-time-field"><input id="editDate" aria-label="תאריך" type="date" value="${escapeHtml(getSchedule(t).date)}"><button type="button" class="clear-schedule" data-clear-schedule="editDate">נקה תאריך</button></div><div class="date-time-field"><input id="editTime" aria-label="שעה" type="time" value="${escapeHtml(getSchedule(t).time)}"><button type="button" class="clear-schedule" data-clear-schedule="editTime">נקה שעה</button></div></div><p class="schedule-hint" id="remindHint" hidden>לתזכורת צריך גם תאריך וגם שעה</p><label class="remind-line"><input id="editRemind" type="checkbox" ${t.remind?'checked':''}> להזכיר לי כשהאפליקציה פתוחה</label></div><div class="modal-buttons"><button class="outline" id="cancel">ביטול</button><button class="primary" id="saveEdit">שמירה</button></div></div></div>`;$('cancel').onclick=()=>$('dialog').replaceChildren();$('saveEdit').onclick=()=>{let text=$('editText').value.trim();if(!text)return toast('צריך לכתוב משהו קודם');t.text=text;t.q=+$('editQ').value;const priorDue=t.due,priorRemind=t.remind;setSchedule(t,$('editDate').value,$('editTime').value,$('editRemind').checked);if(t.due!==priorDue||t.remind!==priorRemind)t.notified=false;save();render();$('dialog').replaceChildren()};setupScheduleControls();$('editText').focus()}
function openNewDialog(q){$('dialog').innerHTML=`<div class="modal-bg" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="הוספת פריט"><h2>הוספת פריט</h2><label class="sr-only" for="editText">תוכן</label><textarea id="editText" placeholder="מה תרצי להוסיף?"></textarea><label class="sr-only" for="editQ">רבע</label><select id="editQ">${quadrants.map((item,i)=>`<option value="${i}" ${i===q?'selected':''}>${item.name}</option>`).join('')}</select><div class="schedule-fields"><span class="schedule-label">תאריך ושעה</span><div class="date-time-row"><div class="date-time-field"><input id="editDate" aria-label="תאריך" type="date"><button type="button" class="clear-schedule" data-clear-schedule="editDate">נקה תאריך</button></div><div class="date-time-field"><input id="editTime" aria-label="שעה" type="time"><button type="button" class="clear-schedule" data-clear-schedule="editTime">נקה שעה</button></div></div><p class="schedule-hint" id="remindHint" hidden>לתזכורת צריך גם תאריך וגם שעה</p><label class="remind-line"><input id="editRemind" type="checkbox"> להזכיר לי כשהאפליקציה פתוחה</label></div><div class="modal-buttons"><button class="outline" id="cancel">ביטול</button><button class="primary" id="saveEdit">הוספה</button></div></div></div>`;$('cancel').onclick=()=>$('dialog').replaceChildren();$('saveEdit').onclick=()=>{const text=$('editText').value.trim();if(!text){$('editText').focus();return}const item={id:crypto.randomUUID?.()||String(Date.now()+Math.random()),text,q:+$('editQ').value,notified:false,done:false};setSchedule(item,$('editDate').value,$('editTime').value,$('editRemind').checked);tasks.unshift(item);save();render();$('dialog').replaceChildren();toast('נוסף ללוח')};setupScheduleControls();$('editText').focus()}
function moveTask(id,q){let t=tasks.find(x=>String(x.id)===String(id));if(!t||t.q===q)return;t.q=q;save();render();toast('הועבר ל־'+quadrants[q].name)}
function bindDrag(){document.querySelectorAll('.task').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.id);e.dataTransfer.effectAllowed='move';el.classList.add('dragged')});el.addEventListener('dragend',()=>{el.classList.remove('dragged');document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))});el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||e.target.closest('button'))return;let id=el.dataset.id;let x=e.clientX,y=e.clientY;let clone=null,active=false;const move=ev=>{if(!active&&Math.hypot(ev.clientX-x,ev.clientY-y)<12)return;if(!active){active=true;clone=el.cloneNode(true);clone.classList.add('dragghost');document.body.appendChild(clone);el.style.opacity='.32'}ev.preventDefault();clone.style.left=ev.clientX-30+'px';clone.style.top=ev.clientY-24+'px';document.querySelectorAll('.quadrant').forEach(n=>n.classList.remove('over'));const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.quadrant');if(target)target.classList.add('over')};const up=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);if(clone)clone.remove();el.style.opacity='';document.querySelectorAll('.quadrant').forEach(n=>n.classList.remove('over'));if(active){el.dataset.justDragged='1';setTimeout(()=>delete el.dataset.justDragged,350);const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.quadrant');if(target)moveTask(id,+target.dataset.drop)}};el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})});document.querySelectorAll('.quadrant').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over')});el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');moveTask(e.dataTransfer.getData('text/plain'),+el.dataset.drop)})})}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,tasks},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='arbaa-revaim-backup.json';a.click();URL.revokeObjectURL(url)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.tasks)||!data.tasks.every(t=>typeof t.text==='string'&&Number.isInteger(t.q)&&t.q>=0&&t.q<=3))throw Error();if(!confirm('להחליף את המשימות הקיימות באלו שבגיבוי?'))return;tasks=data.tasks.map(t=>{const item={id:crypto.randomUUID?.()||String(Math.random()),text:t.text,q:t.q,notified:!!t.notified,done:!!t.done};const schedule=getSchedule(t);setSchedule(item,schedule.date,schedule.time,!!t.remind);return item});save();render();toast('הגיבוי יובא בהצלחה')}catch{toast('קובץ גיבוי לא תקין')}finally{e.target.value=''}};render();checkReminders();setInterval(checkReminders,30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)checkReminders()});if('serviceWorker'in navigator){
 let refreshing=false;
 navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!refreshing){refreshing=true;location.reload()}});
 navigator.serviceWorker.register('./sw.js',{updateViaCache:'none'}).then(reg=>{
  reg.update().catch(()=>{});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)reg.update().catch(()=>{})});
  window.addEventListener('pageshow',()=>reg.update().catch(()=>{}));
 }).catch(()=>{});
}
</script></body></html>
