<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f7f7fb"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="ארבעה רבעים"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="icon.svg"><title>ארבעה רבעים · מטריצת אייזנהאואר</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#242638;background:#f7f7fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}button,input,textarea,select{font:inherit;font-size:16px}button{cursor:pointer}main{max-width:1050px;margin:auto;padding:25px 20px 100px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:24px}h1{font-size:clamp(25px,4.5vw,36px);margin:0;font-weight:790;letter-spacing:-.8px}.sub{color:#77798a;font-size:14px;margin:6px 0 0}.header-buttons{display:flex;gap:7px}.outline{border:1px solid #dfe0e9;background:#fff;border-radius:14px;padding:10px 13px;color:#4e5063}button:hover{filter:brightness(.98)}.composer{background:#fff;border:1px solid #e8e9ef;border-radius:22px;box-shadow:0 8px 32px #2f33500b;padding:17px;margin-bottom:22px}.composer textarea{width:100%;border:0;background:transparent;outline:none;resize:vertical;min-height:68px;max-height:200px;color:#292b3c;font-size:17px}.composer textarea::placeholder{color:#a0a1af}.composer-footer{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid transparent;padding:8px 10px;border-radius:11px;color:#5c5e70;background:#f6f6f9;font-size:13px}.choice.selected{border-color:#8c82ca;box-shadow:0 0 0 2px #c5b9ff55;background:#f0ecff;color:#5949a5}.primary{border:0;border-radius:12px;background:#7867b7;color:white;padding:11px 19px;font-weight:650}.inline-add{display:flex;flex-direction:column;gap:8px;margin-top:12px}.inline-add textarea{display:block;width:100%;min-height:58px;resize:vertical;border:1px solid #ffffffbd;border-radius:12px;background:#ffffffc8;color:#242638;padding:10px 11px;font-size:16px;line-height:1.4;outline-offset:2px}.inline-add textarea::placeholder{color:#77798a}.inline-add button{align-self:flex-start;font-size:14px}.matrix{display:grid;grid-template-columns:1fr 1fr;gap:15px}.quadrant{border:1px solid var(--stroke);background:var(--bg);border-radius:21px;min-height:250px;padding:17px;transition:box-shadow .15s,outline .15s}.quadrant.over{outline:3px dashed #9c8bd7;outline-offset:-8px}.qtitle{display:flex;align-items:center;justify-content:space-between;gap:5px;margin:0 0 4px;font-weight:760;font-size:18px}.qtitle span{background:#ffffffb5;border-radius:50px;padding:2px 9px;font-weight:500;font-size:12px}.hint{margin:0 0 17px;font-size:13px;color:#737587}.items{display:flex;flex-direction:column;gap:9px;min-height:120px}.task{background:#fff;border:1px solid #e9e9f0;border-radius:14px;padding:12px 12px 10px;box-shadow:0 2px 10px #2c2f3a08;touch-action:none;overflow-wrap:anywhere;cursor:grab}.task.dragged{opacity:.45}.task-text{white-space:pre-wrap;font-size:15px;line-height:1.5;margin:0 0 9px}.task-actions{display:flex;justify-content:flex-end;gap:5px;align-items:center}.action{background:#f7f7fa;border:0;border-radius:8px;color:#777989;padding:6px 9px;font-size:12px}.empty{font-size:13px;color:#9394a0;text-align:center;padding:34px 8px;pointer-events:none}.footnote{text-align:center;color:#9b9ba8;font-size:12px;margin:25px 0}.modal-bg{position:fixed;inset:0;background:#24263877;display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(420px,100%);background:#fff;border-radius:20px;padding:20px;box-shadow:0 14px 50px #1113}.modal h2{margin:0 0 12px;font-size:20px}.modal textarea{width:100%;padding:12px;border:1px solid #dedfea;border-radius:12px;resize:vertical;min-height:95px}.modal select{font-size:16px;width:100%;margin:10px 0 14px;padding:11px;border:1px solid #dedfea;border-radius:12px;background:#fff}.modal-buttons{display:flex;gap:8px;justify-content:flex-end}.dragghost{position:fixed;z-index:9999;pointer-events:none;opacity:.9;transform:rotate(-2deg);width:min(275px,75vw);box-shadow:0 12px 40px #30304944}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#333246;color:white;border-radius:12px;padding:11px 18px;z-index:40;font-size:14px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:650px){main{padding:21px 13px 70px}header{align-items:flex-start}h1{font-size:27px}.sub{font-size:12px}.header-buttons{flex-direction:column}.outline{padding:8px;font-size:12px}.matrix{grid-template-columns:1fr 1fr;gap:9px}.quadrant{padding:12px 9px;min-height:200px;border-radius:17px}.qtitle{font-size:14px;align-items:flex-start}.hint{font-size:11px;line-height:1.35;margin-bottom:12px}.task{padding:9px 8px}.task-text{font-size:13px}.action{padding:6px 7px}.composer{padding:14px}.choice{font-size:12px;padding:7px 8px}.primary{padding:10px 15px}}
</style></head><body><main><header><div><h1>ארבעה רבעים <span aria-hidden="true">✦</span></h1><p class="sub">מקום שקט לסדר את מה שחשוב לך</p></div><div class="header-buttons"><button class="outline" id="export">ייצוא גיבוי</button><button class="outline" id="import">ייבוא גיבוי</button><input type="file" accept="application/json" id="file" hidden></div></header><section class="matrix" id="matrix" aria-label="מטריצת אייזנהאואר"></section><p class="footnote">המשימות נשמרות במכשיר הזה בלבד · אפשר לגרור בין הרבעים או לבחור ״העברה״</p></main><div id="dialog"></div><div id="toast-holder"></div><script>
const quadrants=[{name:'חשוב ודחוף',tip:'לעשות עכשיו',color:'#f9e9e8',stroke:'#f0d8d7'},{name:'חשוב, לא דחוף',tip:'לתכנן לזמן המתאים',color:'#e8edf9',stroke:'#d9e2f3'},{name:'דחוף, לא חשוב',tip:'להאציל או לטפל במהירות',color:'#fbf0de',stroke:'#f0e4d0'},{name:'לא חשוב ולא דחוף',tip:'לשחרר או לשקול מחדש',color:'#e7f2e9',stroke:'#d5e9da'}];
const STORE='arbaa-revaim-v1';let tasks=[];try{const loaded=JSON.parse(localStorage.getItem(STORE)||'[]');tasks=Array.isArray(loaded)?loaded.filter(x=>x&&typeof x.text==='string'&&Number.isInteger(x.q)&&x.q>=0&&x.q<4):[]}catch{}let editing=null;let touchDrag=null;const $=id=>document.getElementById(id);function save(){localStorage.setItem(STORE,JSON.stringify(tasks))}function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(t){$('toast-holder').innerHTML='<div class="toast">'+escapeHtml(t)+'</div>';setTimeout(()=>$('toast-holder').replaceChildren(),2100)}function render(){let html='';quadrants.forEach((q,i)=>{let list=tasks.filter(t=>t.q===i);html+=`<section class="quadrant" data-drop="${i}" style="--bg:${q.color};--stroke:${q.stroke}" aria-label="${q.name}"><h2 class="qtitle">${q.name}<span>${list.length}</span></h2><p class="hint">${q.tip}</p><div class="items">${list.length?list.map(t=>`<article class="task" draggable="true" data-id="${escapeHtml(String(t.id))}" tabindex="0"><p class="task-text">${escapeHtml(t.text)}</p><div class="task-actions"><button class="action" data-edit="${escapeHtml(String(t.id))}" aria-label="עריכת משימה">עריכה</button><button class="action" data-move="${escapeHtml(String(t.id))}">העברה</button><button class="action" data-delete="${escapeHtml(String(t.id))}" aria-label="מחיקת משימה">✕</button></div></article>`).join(''):'<div class="empty">כאן עדיין שקט</div>'}</div><div class="inline-add"><label class="sr-only" for="add-text-${i}">הוספה אל ${q.name}</label><textarea id="add-text-${i}" data-input="${i}" placeholder="הוספת משימה או מחשבה..."></textarea><button class="primary" type="button" data-add="${i}">+ הוספה</button></div></section>`});$('matrix').innerHTML=html;document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addToQuadrant(+b.dataset.add));document.querySelectorAll('[data-input]').forEach(el=>el.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();addToQuadrant(+el.dataset.input)}}));document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openDialog(b.dataset.edit,false));document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>openDialog(b.dataset.move,true));document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(confirm('למחוק את הפריט?')){tasks=tasks.filter(t=>String(t.id)!==b.dataset.delete);save();render()}});bindDrag()}
function openDialog(id,move){editing=id;let t=tasks.find(t=>String(t.id)===String(id));if(!t)return;$('dialog').innerHTML=`<div class="modal-bg" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-label="עריכת פריט"><h2>${move?'העברה בין רבעים':'עריכת פריט'}</h2><label class="sr-only" for="editText">תוכן</label><textarea id="editText">${escapeHtml(t.text)}</textarea><label class="sr-only" for="editQ">רבע</label><select id="editQ">${quadrants.map((q,i)=>`<option value="${i}" ${i===t.q?'selected':''}>${q.name}</option>`).join('')}</select><div class="modal-buttons"><button class="outline" id="cancel">ביטול</button><button class="primary" id="saveEdit">שמירה</button></div></div></div>`;$('cancel').onclick=()=>$('dialog').replaceChildren();$('saveEdit').onclick=()=>{let text=$('editText').value.trim();if(!text)return toast('צריך לכתוב משהו קודם');t.text=text;t.q=+$('editQ').value;save();render();$('dialog').replaceChildren()};$('editText').focus()}
function addToQuadrant(q){const input=$('add-text-'+q);const text=input.value.trim();if(!text){input.focus();return}tasks.unshift({id:crypto.randomUUID?.()||String(Date.now()+Math.random()),text,q});save();render();$('add-text-'+q).focus();toast('נוסף ל־'+quadrants[q].name)};function moveTask(id,q){let t=tasks.find(x=>String(x.id)===String(id));if(!t||t.q===q)return;t.q=q;save();render();toast('הועבר ל־'+quadrants[q].name)}
function bindDrag(){document.querySelectorAll('.task').forEach(el=>{el.addEventListener('dragstart',e=>{e.dataTransfer.setData('text/plain',el.dataset.id);e.dataTransfer.effectAllowed='move';el.classList.add('dragged')});el.addEventListener('dragend',()=>{el.classList.remove('dragged');document.querySelectorAll('.over').forEach(n=>n.classList.remove('over'))});el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'||e.target.closest('button'))return;let id=el.dataset.id;let x=e.clientX,y=e.clientY;let clone=null,active=false;const move=ev=>{if(!active&&Math.hypot(ev.clientX-x,ev.clientY-y)<12)return;if(!active){active=true;clone=el.cloneNode(true);clone.classList.add('dragghost');document.body.appendChild(clone);el.style.opacity='.32'}ev.preventDefault();clone.style.left=ev.clientX-30+'px';clone.style.top=ev.clientY-24+'px';document.querySelectorAll('.quadrant').forEach(n=>n.classList.remove('over'));const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.quadrant');if(target)target.classList.add('over')};const up=ev=>{el.removeEventListener('pointermove',move);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);if(clone)clone.remove();el.style.opacity='';document.querySelectorAll('.quadrant').forEach(n=>n.classList.remove('over'));if(active){const target=document.elementFromPoint(ev.clientX,ev.clientY)?.closest('.quadrant');if(target)moveTask(id,+target.dataset.drop)}};el.setPointerCapture(e.pointerId);el.addEventListener('pointermove',move);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})});document.querySelectorAll('.quadrant').forEach(el=>{el.addEventListener('dragover',e=>{e.preventDefault();el.classList.add('over')});el.addEventListener('dragleave',e=>{if(!el.contains(e.relatedTarget))el.classList.remove('over')});el.addEventListener('drop',e=>{e.preventDefault();el.classList.remove('over');moveTask(e.dataTransfer.getData('text/plain'),+el.dataset.drop)})})}
$('export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,tasks},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='arbaa-revaim-backup.json';a.click();URL.revokeObjectURL(url)};$('import').onclick=()=>$('file').click();$('file').onchange=async e=>{let file=e.target.files[0];if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.tasks)||!data.tasks.every(t=>typeof t.text==='string'&&Number.isInteger(t.q)&&t.q>=0&&t.q<=3))throw Error();if(!confirm('להחליף את המשימות הקיימות באלו שבגיבוי?'))return;tasks=data.tasks.map(t=>({id:crypto.randomUUID?.()||String(Math.random()),text:t.text,q:t.q}));save();render();toast('הגיבוי יובא בהצלחה')}catch{toast('קובץ גיבוי לא תקין')}finally{e.target.value=''}};render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
